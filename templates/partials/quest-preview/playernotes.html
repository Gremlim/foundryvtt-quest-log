<div class="quest-playernotes">
  <h1>{{localize 'QuestLog.QuestPreview.Labels.PlayerNotes'}}</h1>
  {{#if canEditPlayerNotes}}
    <prose-mirror name="playernotes" toggled value="{{source.playernotes}}">{{{playernotes}}}</prose-mirror>
  {{else}}
    <prose-mirror name="playernotes" toggled disabled value="{{source.playernotes}}">{{{playernotes}}}</prose-mirror>
  {{/if}}
</div>
